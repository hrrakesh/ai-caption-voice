{% extends 'base.html' %}

{% block title %}Sign Up - AI Caption & Voiceover App{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Start generating beautiful image captions and voiceovers</p>
        </div>
        
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Create password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password"><i class="fa-solid fa-check-double"></i> Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
            </div>
            
            <button type="submit" class="glass-btn btn-primary btn-block">
                <span>Sign Up <i class="fa-solid fa-user-plus"></i></span>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
